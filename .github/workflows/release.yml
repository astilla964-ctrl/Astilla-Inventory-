name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: setup-keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret for release keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding bundled debug keystore as fallback..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore found, debug build fallback enabled."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        id: build-apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          
          # If gradlew wrapper is present, use it; otherwise use system gradle
          GRADLE_CMD="./gradlew"
          if [ ! -f "gradlew" ]; then
            GRADLE_CMD="gradle"
          fi

          if [ "${{ steps.setup-keystore.outputs.has_release_keystore }}" = "true" ]; then
            echo "Building Release APK with signing credentials..."
            $GRADLE_CMD assembleRelease
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "Building APK (using assembleDebug / fallback signing)..."
            $GRADLE_CMD assembleDebug
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          # Determine target tag name
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi

          # Format release asset filename: pos-inventory-<tag>.apk
          ASSET_FILENAME="pos-inventory-${TAG}.apk"
          cp "$APK_SRC" "$ASSET_FILENAME"

          echo "apk_path=$ASSET_FILENAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Built asset: $ASSET_FILENAME from $APK_SRC"

      # Step 1 of artifact preservation: Upload Actions Artifact FIRST.
      # using 'if: always()' guarantees that even if a subsequent step (such as GitHub Release)
      # fails, the built APK artifact remains fully preserved and downloadable in GitHub Actions.
      - name: Upload Actions Artifact (Always Retained)
        uses: actions/upload-artifact@v4
        if: always() && steps.build-apk.outputs.apk_path != ''
        with:
          name: ${{ steps.build-apk.outputs.apk_path }}
          path: ${{ steps.build-apk.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 30

      # Step 2: Publish GitHub Release with direct .apk attachment
      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.build-apk.outputs.tag_name }}
          name: Release ${{ steps.build-apk.outputs.tag_name }}
          files: ${{ steps.build-apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
