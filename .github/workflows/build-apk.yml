name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Unable to detect Java version string."
            exit 1
          fi
          
          # Extract major version (handles "17.0.x" or legacy "1.8.x")
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected active Java major version: $MAJOR_VERSION"
          
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse a valid numeric Java major version from '$RAW_VERSION'."
            exit 1
          fi
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java version ($MAJOR_VERSION) is lower than required version 17."
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at: $EXPECTED_APK"
            echo "Discovered APK files under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: '$EXPECTED_APK' is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: '$EXPECTED_APK' is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: '$EXPECTED_APK' does not have a .apk extension."; exit 1 ;;
          esac
          
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi
          
          echo "APK successfully verified: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          RUNNER_TEMP_DIR=$(mktemp -d -t apk-release-asset-XXXXXX)
          
          RAW_REPO="${{ github.repository }}"
          REPO_NAME="${RAW_REPO##*/}"
          
          # Sanitize repository name: convert to lowercase and replace non-alphanumeric chars with hyphens
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi
          
          RUN_NUM="${{ github.run_number }}"
          RELEASE_ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${RUN_NUM}.apk"
          RELEASE_ASSET_PATH="${RUNNER_TEMP_DIR}/${RELEASE_ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at '$RELEASE_ASSET_PATH'."
            exit 1
          fi
          
          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension."; exit 1 ;;
          esac
          
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: $RELEASE_ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at '$ASSET_PATH'."
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset '$ASSET_PATH' is empty."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset is not a .apk file."; exit 1 ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          
          echo "Creating GitHub Release with tag '$RELEASE_TAG'..."
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug Build
          - **Build System**: GitHub Actions
          - **GitHub Actions Run Number**: ${{ github.run_number }}
          - **GitHub Actions Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Build Type**: Debug APK
          - **Signing**: Signed only with a temporary debug keystore
          
          > **Notice**: This is an automatically generated debug APK intended for testing. The APK is not a Play Store production release.
          EOF
          )
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always() && steps.upload-artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare-asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish-release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release created successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: $ASSET_NAME"
            echo "=================================================="
            
            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: \`$RELEASE_TITLE\`"
              echo "- **APK Asset Filename**: \`$ASSET_NAME\`"
              echo "- **Direct Release Page URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "📱 **Download Instructions**:"
              echo "You can download the \`$ASSET_NAME\` APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) to install on your phone."
              echo ""
              echo "📦 **GitHub Actions Artifact**:"
              echo "The normal Actions artifact \`app-debug-apk\` is also available as a backup in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped. The APK build and Actions artifact upload completed successfully."
            echo "The debug APK artifact 'app-debug-apk' remains fully available for download from GitHub Actions."
            
            {
              echo "## ⚠️ Debug APK Built (Release Publishing Warning)"
              echo ""
              echo "- **APK Build**: Succeeded"
              echo "- **Actions Artifact**: Uploaded successfully (\`app-debug-apk\`)"
              echo "- **Release Publishing Status**: Failed or skipped"
              echo ""
              echo "📦 **Download from Artifacts**:"
              echo "The APK build completed successfully. You can download the \`app-debug-apk\` artifact directly from the **Artifacts** section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
